name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version | sed -n 2p
          shellcheck -x install.sh bootstrap.sh lib/*.sh modules/*.sh scripts/*.sh tests/*.sh
      - name: zsh config syntax
        run: |
          sudo apt-get install -y -qq zsh
          for f in config/zsh/zshrc config/zsh/*.zsh config/zsh/*/*.zsh; do zsh -n "$f"; done

  linux:
    # Each image runs the full scenario suite (tests/container.sh), including
    # the tag-pinned install from a throwaway remote with two releases.
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "fedora:41"]
    steps:
      - uses: actions/checkout@v7
      - name: tests/run.sh ${{ matrix.image }}
        run: tests/run.sh "${{ matrix.image }}"

  macos:
    needs: shellcheck
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: tests/macos.sh (real install on the runner)
        env:
          CI: "true"
        run: tests/macos.sh
